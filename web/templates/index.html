<!doctype html>
<html lang="en">

{% block head %}
{% endblock %}

<body class="bg-[var(--white)] text-[var(--black)]">
	<div class="w-[min(100%, var(--pw)] mx-auto py-4">
		<header class="flex gap-6 w-full items-center justify-center">
			<div class="flex gap-0.5 items-center">
				<img src="/static/img/logo.png" class="w-4 h-4">
				<span class="font-bold uppercase">ADDIT</span>
			</div>
			<nav>
				<ul class="flex gap-8 items-center list-none">
					<li class="hover:underline cursor-pointer">Home</li>
					<li class="hover:underline cursor-pointer">Features</li>
					<li class="hover:underline cursor-pointer">Pricing</li>
					<li class="hover:underline cursor-pointer">Testimonials</li>
				</ul>
			</nav>
			<a href="/login"
				class="no-underline py-2 px-4 rounded-3xl cursor-pointer text-[var(--white)] bg-[var(--black)] border-1 border-[--var(black)] hover">Sign
				In
			</a>
		</header>

		<main class="py-16">
			<div class="py-8">
				<h1 class="text-4xl text-center">AI Powererd</h1>
				<h1 class="text-4xl text-center">Tech Solutions</h1>
				<p class="text-2xl text-center">Simplify Workflows, Automate Processes</p>
			</div>
			<div class="w-max mx-auto">
				<div>
					<a class="relative z-50 no-underline py-3 px-4 rounded-3xl cursor-pointer text-[var(--white)] bg-[var(--black)]"
						href="/signup">Get Started</a>
					<div class="relative z-0 flex w-full -translate-y-2.5">
						<span class="blur-md w-full h-6 rounded-full bg-pink-400"></span>
						<span class="blur-md w-full h-6 rounded-full bg-blue-400"></span>
						<span class="blur-md w-full h-6 rounded-full bg-green-400"></span>
						<span class="blur-md w-full h-6 rounded-full bg-yellow-300"></span>
					</div>
				</div>
			</div>
		</main>
		<footer class="flex gap-10 justify-center">
		</footer>
	</div>
</body>

</html>
