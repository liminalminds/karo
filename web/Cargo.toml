[package]
name = "karo"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
